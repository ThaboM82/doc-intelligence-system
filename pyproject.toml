[project]
name = "doc-intelligence-system"
version = "0.1.1"
description = "Layout-aware document intelligence system with security scanning, RAG, and quarantine workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Thabo" }
]
license = { text = "MIT" }
keywords = [
    "document-intelligence",
    "rag",
    "prompt-injection",
    "qdrant",
    "fastapi",
]
dependencies = [
    # Core API
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "structlog>=24.1.0",

    # Document parsing / RAG
    "docling>=1.1.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "ragas>=0.1.8",

    # Vector store
    "qdrant-client>=1.9.0",

    # Data stores
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",

    # Security / ops
    "dnspython>=2.6.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "anyio>=4.0.0",
    "Faker>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
]

[project.urls]
Homepage = "https://github.com/Thabo/doc-intelligence-system"
Documentation = "https://github.com/Thabo/doc-intelligence-system#readme"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "backend*"]

# ------------------------------------------------------------------------------
# Pytest
# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "slow: mark test as slow running",
    "security: mark test as security/vulnerability test",
    "integration: mark test as multi-component integration test",
]

# ------------------------------------------------------------------------------
# Ruff (optional lint)
# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

# ------------------------------------------------------------------------------
# Coverage
# ------------------------------------------------------------------------------
[tool.coverage.run]
source = ["app", "backend"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true