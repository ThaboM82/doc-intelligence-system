# Prometheus scrape config for Document Intelligence & Security API
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#   or: prometheus --config.file=prometheus/prometheus.yml

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 15s
  external_labels:
    project: doc-intelligence-system

# Optional: load alert rules later
# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:
  # ---------------------------------------------------------------------------
  # Production API (Render)
  # ---------------------------------------------------------------------------
  - job_name: doc-intelligence-api
    metrics_path: /metrics
    scheme: https
    scrape_interval: 30s
    scrape_timeout: 15s
    static_configs:
      - targets:
          - doc-intelligence-system-8ase.onrender.com
        labels:
          env: production
          service: doc-intelligence
          provider: render
    # Uncomment if you enable METRICS_REQUIRE_TOKEN / METRICS_SCRAPE_TOKEN
    # authorization:
    #   type: Bearer
    #   credentials: REPLACE_WITH_METRICS_SCRAPE_TOKEN

  # ---------------------------------------------------------------------------
  # Local API (host machine via Docker Desktop)
  # ---------------------------------------------------------------------------
  - job_name: doc-intelligence-api-local
    metrics_path: /metrics
    scheme: http
    scrape_interval: 15s
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          env: local
          service: doc-intelligence
    # Linux without host.docker.internal — use host network or LAN IP:
    #   - targets: ["172.17.0.1:8000"]

  # ---------------------------------------------------------------------------
  # Optional: Pushgateway (if PROMETHEUS_PUSHGATEWAY_URL is used)
  # ---------------------------------------------------------------------------
  # - job_name: pushgateway
  #   honor_labels: true
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets:
  #         - pushgateway:9091
  #       labels:
  #         env: shared
  #         service: pushgateway

  # ---------------------------------------------------------------------------
  # Optional: Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus